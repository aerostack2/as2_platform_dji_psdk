name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: Aerostack2 branch to build against
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/as2_platform_dji_psdk
      - uses: actions/checkout@v4
        with:
          repository: aerostack2/aerostack2
          ref: ${{ github.event.inputs.target_branch || 'main' }}
          path: src/aerostack2
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          DISTRO: ${{ matrix.distro }}
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-rosdep python3-colcon-common-extensions python3-vcstool git > /dev/null
          # psdk_interfaces is released for Humble but not Jazzy: build it from source on both.
          vcs import src < src/as2_platform_dji_psdk/dependencies.repos
          [ -f /etc/ros/rosdep/sources.list.d/20-default.list ] || rosdep init
          rosdep update --rosdistro "$DISTRO" > /dev/null
          rosdep install -y -r -q --rosdistro "$DISTRO" --ignore-src --from-paths \
            $(colcon list --base-paths src --paths-only --packages-up-to as2_platform_dji_psdk)
      - name: Build
        shell: bash
        run: |
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          colcon build --base-paths src --packages-up-to as2_platform_dji_psdk
      - name: Test
        shell: bash
        run: |
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          source install/setup.bash
          colcon test --base-paths src --packages-select as2_platform_dji_psdk \
            --return-code-on-test-failure
